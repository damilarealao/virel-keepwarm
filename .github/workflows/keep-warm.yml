name: Keep API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://virel.com.ng/api/health)
          echo "health: $code"
          test "$code" = "200"

  # GitHub disables schedules after 60 days of repo inactivity; this monthly
  # no-op commit keeps the repo alive so the ping never stops.
  activity-keeper:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 1 * *'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date > last-activity.txt
          git config user.name "warm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last-activity.txt
          git commit -m "keepalive $(date -u +%Y-%m-%d)"
          git push
