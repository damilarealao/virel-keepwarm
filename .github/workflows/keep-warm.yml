name: Keep API warm

on:
  schedule:
    - cron: "*/5 * * * *"   # backstop; the real cadence is the self-chain below
  workflow_dispatch:
    inputs:
      test_failure:
        description: "Simulate a failed health check (tests alerting)"
        type: boolean
        default: false

# One live chain at any time: a new trigger cancels the sleeping predecessor
# and starts a fresh chain, so duplicates collapse instead of multiplying.
# Each run gets its own group (runs exit after dispatching their successor,
# so chains stay linear); only the scheduler backstop shares one slot.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'keep-warm-schedule' || format('keep-warm-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    steps:
      - name: Ping health endpoint
        id: ping
        run: |
          if [ "${{ vars.TEST_FORCE_FAILURE }}" = "1" ] || [ "${{ inputs.test_failure }}" = "true" ]; then
            echo "TEST FAILURE MODE"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://virel.com.ng/api/health)
          echo "health: $code"
          test "$code" = "200" || exit 1

      - name: Restore alert state
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: alert-state.txt
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Alert on failure (once per outage)
        if: failure() && steps.ping.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -f alert-state.txt ] && grep -q failing alert-state.txt; then
            echo "still down — no repeat alert"
          else
            RESP=$(curl -sS "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT" \
              --data-urlencode text="🔴 VIREL DOWN — health check failed at $(date -u '+%H:%M UTC'). Investigate: https://virel.com.ng/status") || true
            echo "telegram response: $RESP"
            echo "$RESP" | grep -q '"ok":true' || { echo "::error::Telegram send failed"; exit 1; }
            echo "alert sent"
          fi
          echo failing > alert-state.txt

      - name: Save failing state immediately
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: alert-state.txt
          key: alert-state-${{ github.run_id }}

      - name: Alert on recovery
        if: success() && steps.ping.outcome == 'success'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ ! -f alert-state.txt ] || ! grep -q failing alert-state.txt; then
            echo "was healthy — no recovery notice needed"
            echo ok > alert-state.txt
            exit 0
          fi
          curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode text="🟢 VIREL RECOVERED — health check passing again ($(date -u '+%H:%M UTC'))" | grep -q '"ok":true'
          echo ok > alert-state.txt

      - name: Save recovered state immediately
        if: success() && steps.ping.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: alert-state.txt
          key: alert-state-${{ github.run_id }}

      # Chain continuation runs even if the ping failed, so a single bad
      # request never kills the loop. Public repo => runner minutes are free.
      - name: Schedule the next ping (~5 min cadence)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleep 270
          gh api -X POST "repos/$REPO/actions/workflows/keep-warm.yml/dispatches" -f ref=main

  # GitHub disables scheduled workflows after 60 days without repo activity;
  # this monthly no-op commit keeps the repo alive.
  activity-keeper:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 1 * *'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date > last-activity.txt
          git config user.name "warm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last-activity.txt
          git commit -m "keepalive $(date -u +%Y-%m-%d)"
          git push
